<!-- CHANGED: shows visibleImages (failed images are skipped) and reports load errors. -->
<div class="gallery__main">
  <!-- CHANGED: a "no image" / loading placeholder when there is no image to show. -->
  @if (visibleImages()[index()]; as image) {
    <img [src]="image" [alt]="name()" (error)="markFailed(image)" />
  } @else {
    <span class="gallery__placeholder" [class.is-loading]="loading()" role="img" [attr.aria-label]="(loading() ? 'Loading image of ' : 'No image for ') + name()">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="3" /><circle cx="9" cy="9" r="1.5" /><path d="m4.5 18 5-5 3 3 2-2 5 5" /></svg>
    </span>
  }
  <!-- CHANGED: can be disabled by the page (wishlistDisabled). -->
  <app-button class="gallery__wish" variant="icon" size="small" [class.is-active]="wishlisted()" [ariaLabel]="wishlisted() ? 'Remove from wishlist' : 'Add to wishlist'" [ariaPressed]="wishlisted()" [disabled]="wishlistDisabled()" (clicked)="wishlistToggle.emit()">
    {{ wishlisted() ? '♥' : '♡' }}
  </app-button>
  @if (visibleImages().length > 1) {
    <app-button class="gallery__arrow gallery__arrow--prev" variant="icon" size="small" ariaLabel="Previous image" (clicked)="step(-1)">‹</app-button>
    <app-button class="gallery__arrow gallery__arrow--next" variant="icon" size="small" ariaLabel="Next image" (clicked)="step(1)">›</app-button>
  }
</div>
@if (visibleImages().length > 1) {
  <div class="gallery__thumbs">
    @for (image of visibleImages(); track $index) {
      <button type="button" class="gallery__thumb" [class.is-active]="index() === $index" [attr.aria-label]="'View image ' + ($index + 1)" [attr.aria-pressed]="index() === $index" (click)="select($index)">
        <img [src]="image" alt="" (error)="markFailed(image)" />
      </button>
    }
  </div>
}
