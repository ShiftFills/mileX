<div class="gallery__main">
  <img [src]="images()[index()]" [alt]="name()" />
  <app-button class="gallery__wish" variant="icon" size="small" [class.is-active]="wishlisted()" [ariaLabel]="wishlisted() ? 'Remove from wishlist' : 'Add to wishlist'" [ariaPressed]="wishlisted()" (clicked)="wishlistToggle.emit()">
    {{ wishlisted() ? '♥' : '♡' }}
  </app-button>
  @if (images().length > 1) {
    <app-button class="gallery__arrow gallery__arrow--prev" variant="icon" size="small" ariaLabel="Previous image" (clicked)="step(-1)">‹</app-button>
    <app-button class="gallery__arrow gallery__arrow--next" variant="icon" size="small" ariaLabel="Next image" (clicked)="step(1)">›</app-button>
  }
</div>
@if (images().length > 1) {
  <div class="gallery__thumbs">
    @for (image of images(); track $index) {
      <button type="button" class="gallery__thumb" [class.is-active]="index() === $index" [attr.aria-label]="'View image ' + ($index + 1)" [attr.aria-pressed]="index() === $index" (click)="select($index)">
        <img [src]="image" alt="" />
      </button>
    }
  </div>
}
