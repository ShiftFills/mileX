<section class="hero" aria-label="Featured offer">
  <img
    class="hero__artwork"
    src="/images/Section%20-%20HeroPromoBanner.svg"
    alt=""
    fetchpriority="high"
  />
  <a class="hero__shop-link" [routerLink]="routes.products" aria-label="Shop the featured offer"></a>
  <div class="hero__mobile">
    <div class="hero__mobile-copy">
      <p>Everything You Need</p>
      <h1>All in One Place</h1>
      <p>
        @for (category of categories().slice(0, 4); track category.id; let last = $last) {
          {{ category.label }}@if (!last) { <span aria-hidden="true">•</span> }
        }
      </p>
      <a class="btn btn-sm" [routerLink]="routes.products">Shop Now <span aria-hidden="true">→</span></a>
    </div>
    <div class="hero__mobile-sale" aria-label="Special offer: Mega sale, limited time only">
      <span>Special offer</span>
      <strong>MEGA SALE</strong>
      <span>Limited time only</span>
    </div>
  </div>
</section>
