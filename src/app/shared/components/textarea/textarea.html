<textarea
  class="form-control"
  [class.form-control--compact]="size() === 'compact'"
  [id]="inputId()"
  [name]="name()"
  [placeholder]="placeholder()"
  [value]="value()"
  [rows]="rows()"
  [required]="required()"
  [disabled]="disabled()"
  [attr.aria-label]="ariaLabel()"
  (input)="valueInput.emit($event)"
  (change)="valueChange.emit($event)"
></textarea>
