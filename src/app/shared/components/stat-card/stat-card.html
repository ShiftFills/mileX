<article class="stat-card">
  <div class="stat-card__top">
    <span class="stat-card__label">{{ label() }}</span>
    <span class="stat-card__icon" [class]="'stat-card__icon stat-card__icon--' + tone()" aria-hidden="true">
      @if (iconImage()) {
        <img [src]="iconImage()" alt="" />
      } @else {
        <svg viewBox="0 0 16 16" fill="none">
          @switch (icon()) {
            @case ('cart') { <path d="M1.5 2h2l1.4 8.1a1.5 1.5 0 0 0 1.5 1.2h6.1a1.5 1.5 0 0 0 1.5-1.2L15 5H4" /><circle cx="6.5" cy="14" r=".6" /><circle cx="12" cy="14" r=".6" /> }
            @case ('revenue') { <circle cx="8" cy="8" r="6" /><path d="M5.8 5.5h4.4M5.8 8h4.4M7 5.5c2.4 0 2.4 3.4 0 3.4L5.8 8.9 9.2 11" /> }
            @case ('pending') { <circle cx="8" cy="8" r="6" /><path d="M5.5 8h.01M8 8h.01M10.5 8h.01" /> }
            @case ('shipped') { <path d="M1.5 4h8v6.5h-8zM9.5 6.5h3l2 2v2h-5z" /><circle cx="4.5" cy="11.5" r="1" /><circle cx="11.5" cy="11.5" r="1" /> }
            @case ('delivered') { <path d="M3 5.5 8 3l5 2.5v5L8 13l-5-2.5zM3 5.5 8 8l5-2.5M8 8v5M5.5 4.2l5 2.6" /> }
            @case ('returns') { <rect x="2" y="3" width="12" height="10" rx="2" /><path d="M5 8h5M8.5 6 10.5 8 8.5 10" /> }
            @case ('approved') { <circle cx="8" cy="8" r="6" /><path d="m5.5 8.2 1.8 1.8 3.2-3.6" /> }
            @case ('transit') { <path d="M8 1.8 13.5 4.6v6.8L8 14.2 2.5 11.4V4.6zM2.5 4.6 8 7.4l5.5-2.8M8 7.4v6.8" /> }
            @case ('rejected') { <circle cx="8" cy="8" r="6" /><path d="m6 6 4 4M10 6l-4 4" /> }
            @case ('sellers') { <circle cx="6" cy="5.5" r="2" /><path d="M2 12.5c0-2 1.8-3 4-3s4 1 4 3" /><circle cx="11.5" cy="6" r="1.5" /><path d="M11.5 9.3c1.7 0 2.7.9 2.7 2.4" /> }
          }
        </svg>
      }
    </span>
  </div>
  <div class="stat-card__value">
    @if (prefix()) {
      <small>{{ prefix() }}</small>
    }
    {{ value() }}
  </div>
  @if (trend()) {
    <div class="stat-card__trend" [class.stat-card__trend--negative]="trendTone() === 'negative'">
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
        @if (trendDirection() === 'up') { <path d="M4 12 12 4M5.5 4H12v6.5" /> } @else { <path d="M12 4 4 12M4 5.5V12h6.5" /> }
      </svg>
      <span>{{ trend() }}</span>
    </div>
  }
</article>
