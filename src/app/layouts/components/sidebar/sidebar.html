<nav class="sidebar" [class.sidebar--admin]="variant() === 'admin'" [attr.aria-label]="title() || 'Section'">
  @if (title()) {
    <h2 class="sidebar__title">{{ title() }}</h2>
  }
  <ul>
    @for (link of links(); track link.path) {
      <li>
        <a [routerLink]="link.path" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: !link.children?.length }">
          @if (link.icon) {
            <svg class="sidebar__icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              @switch (link.icon) {
                @case ('dashboard') { <rect x="2" y="2" width="4" height="4" rx=".7" /><rect x="10" y="2" width="4" height="4" rx=".7" /><rect x="2" y="10" width="4" height="4" rx=".7" /><rect x="10" y="10" width="4" height="4" rx=".7" /> }
                @case ('products') { <circle cx="8" cy="8" r="5.5" /><path d="M5 8h6M8 5v6" /> }
                @case ('cart') { <path d="M1.5 2h2l1.4 8.1a1.5 1.5 0 0 0 1.5 1.2h6.1a1.5 1.5 0 0 0 1.5-1.2L15 5H4M6.5 14a.7.7 0 1 0 0 .1M12 14a.7.7 0 1 0 0 .1" /> }
              }
            </svg>
          }
          <span>{{ link.label }}</span>
        </a>
        @if (link.children?.length) {
          <ul class="sidebar__children">
            @for (child of link.children; track child.path) {
              <li><a [routerLink]="child.path" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">{{ child.label }}</a></li>
            }
          </ul>
        }
      </li>
    }
  </ul>
</nav>
