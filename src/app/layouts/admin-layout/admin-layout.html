<div class="admin-page">
  <header class="admin-topbar">
    <a class="admin-brand" routerLink="/" aria-label="MileX home"><span>milex</span></a>
    <label class="admin-search" aria-label="Search orders, products, sellers, customers">
      <img src="/images/search-icon.svg" alt="" aria-hidden="true" />
      <input type="search" placeholder="Search orders, products, sellers, customers..." />
    </label>
    <div class="admin-user-actions">
      <button class="admin-icon-button" type="button" aria-label="Notifications">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M12 6a4 4 0 0 0-8 0c0 4-1.5 4.5-1.5 5.5h11C13.5 10.5 12 10 12 6ZM6.5 13.5h3" /></svg>
        <i></i>
      </button>
      <!-- CHANGED: the signed-in user's name, initials and role, with an account menu holding Log Out. -->
      @if (isAuthenticated()) {
        <div class="admin-account" appClickOutside (clickedOutside)="closeAccountMenu()" (keydown.escape)="closeAccountMenu()">
          <button
            class="admin-user"
            type="button"
            aria-haspopup="menu"
            aria-controls="admin-account-menu"
            [attr.aria-expanded]="accountMenuOpen()"
            [attr.aria-label]="'Account menu for ' + displayName() + ', ' + roleLabel()"
            (click)="toggleAccountMenu()"
          >
            <span class="admin-user__avatar" aria-hidden="true">{{ initials() }}</span>
            <span class="admin-user__name">{{ displayName() }}<small>{{ roleLabel() }}</small></span>
          </button>
          @if (accountMenuOpen()) {
            <div class="admin-account-menu" id="admin-account-menu" role="menu">
              <div class="admin-account-menu__profile">
                <strong>{{ displayName() }}</strong>
                <small>{{ roleLabel() }}</small>
              </div>
              <button class="admin-account-menu__item" type="button" role="menuitem" (click)="logout()">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path [attr.d]="logoutIcon" /></svg>
                Log Out
              </button>
            </div>
          }
        </div>
      }
    </div>
  </header>

  <div class="admin-layout">
    <aside class="admin-sidebar"><app-sidebar variant="admin" [links]="links" /></aside>
    <section class="admin-route-content"><router-outlet /></section>
  </div>
</div>
